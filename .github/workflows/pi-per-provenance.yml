name: Pi Per provenance

on:
  push:
    branches:
      - 'pi-per/**'
  pull_request:
    branches:
      - 'pi-per/**'

permissions:
  contents: read

jobs:
  verify:
    name: Verify downstream provenance
    runs-on: ubuntu-24.04
    steps:
      - name: Check out full history
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - name: Set up pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'
      - name: Verify provenance manifest and ancestry
        run: bun scripts/verify-pi-per-provenance.mjs --manifest pi-per-provenance.json --require-ancestry
